<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adam Řezáč</title>

    <style>
        body {
            background-color: rgb(75, 0, 0);
            font-size: 16px;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .vizitka {
            width: 90mm;
            aspect-ratio: 9 / 5;
            border: 4px solid black;
            border-radius: 15px;
            background-color: white;
            padding: 10px;
            margin: 0;
            position: relative;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.295);
            text-align: left;
        }

        .fotka {
            width: 25%;
            border: 2px solid black;
            border-radius: 10px;
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .jmeno {
            font-size: 20px;
            font-weight: bold;
            margin-top: 0;
        }

        .fotka:hover {
            cursor: crosshair;
        }

        button {
            background-color: rgb(75, 0, 0);
            color: white;
            border: 2px solid black;
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="vizitka">
        <img src="fotka.png" class="fotka" alt="Adamova profilovka" onclick="alert('Já jsem Adam, nestřílej na mě❗')">

        <h1 class="jmeno">Adam Řezáč</h1>

        <p>Jsem žák na Gymnáziu Arabská,<br> blud a jahoda.</p>

        <h2>Mé 3 oblíbené věci</h2>

        <ul>
            <li>gooning</li>
            <li>Ondřej Roszky</li>
            <li>rybařeníčko</li>
        </ul>

        <button onclick="alert('Tlačítko funguje')">
            Klikni na mě
        </button>
    </div>
</body>

</html>
